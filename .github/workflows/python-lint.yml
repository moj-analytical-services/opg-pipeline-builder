---
name: Python Linting
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  lint_python:
    name: Lint with Ruff
    permissions:
      contents: read
    uses: ministryofjustice/data-engineering-github-actions/.github/workflows/reusable-python-lint.yml@3040f4682ca515997a4177a29a02e8478b24669a
