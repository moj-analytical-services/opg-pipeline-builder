---
name: Python Linting
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  lint_python:
    name: Lint with Ruff
    permissions:
      contents: read
    uses: ministryofjustice/data-engineering-github-actions/.github/workflows/reusable-python-lint.yml@ace450d0fa64b84ea2db574e7933d374716fab8b
