---
name: Python Unit Test
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    paths:
      - "**/*.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  python-unit-test:
    name: Python Unit Test
    permissions:
      contents: read
    uses: ministryofjustice/data-engineering-github-actions/.github/workflows/reusable-python-unit-test.yml@3040f4682ca515997a4177a29a02e8478b24669a
    with:
      uv_sync_groups: "--locked --all-extras --all-groups"
