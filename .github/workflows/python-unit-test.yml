---
name: Python Unit Test
on:
  pull_request:
    types: [edited, opened, reopened, synchronize]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  python-unit-test:
    name: Python Unit Test
    permissions:
      contents: read
    uses: ministryofjustice/data-engineering-github-actions/.github/workflows/reusable-python-unit-test.yml@ace450d0fa64b84ea2db574e7933d374716fab8b
    with:
      uv_sync_groups: "--locked --all-extras --all-groups"
