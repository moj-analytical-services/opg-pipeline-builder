[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "opg_pipeline_builder"
version = "0.4.0"
description = "Provides common re-usable components for building OPG data pipelines"
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
    "awswrangler>=3.18.0",
    "boto3>=1.43.0",
    "jinja2>=3.1.6",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[tool.uv]
package = true
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "prek>=0.5.10",
    "ruff>=0.17.3",
]

[project.optional-dependencies]
test = [
    "duckdb>=1.5.4",
    "freezegun>=1.5.5",
    "moto[glue]>=5.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.lint.coverage.paths]
source = ["src", "tests"]

[tool.lint.coverage.run]
branch = true
source = ["src", "tests"]

[tool.lint.coverage.report]
show_missing = true

[tool.mypy]
strict = true
disallow_untyped_defs = true
exclude = "migrations|dist|build|typings"
explicit_package_bases = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]


[tool.ruff]
exclude = ["typings", "playground"]
force-exclude = true
# Legacy code pending rewrite.
extend-exclude = [
    "src/opg_pipeline_builder/transform_engines",
    "src/opg_pipeline_builder/utils",
    "src/opg_pipeline_builder/database.py",
    "src/opg_pipeline_builder/transforms.py",
    "src/opg_pipeline_builder/validator.py",
    "tests/old_unit/*"
]

[tool.ruff.lint]
extend-select = ["E"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = [
    "A001", # redefine some builtins (like "copyright") is OK in docs
]
"noxfile.py" = [
    "D402" # repeating the name of the function is OK for nox since it's to display it to the user
]
"tests/*" = [
    "ARG", # some arguments are unused in tests functions but useful (e.g. mocks)
    "S101", # asserts are OK in tests
    "SLF001", # accessing private members is OK in tests
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean-typed keyword argument in function definition
    "PLR0913", # too many arguments in function definition
    "PLR0917", # too many positional arguments in function definition
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["opg_pipeline_builder", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.lint.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "tests"]

[tool.lint.bandit]
skips = [
    "B101", # assert used
]
